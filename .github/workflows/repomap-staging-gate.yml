name: repomap-staging-gate

# Private repo-map_dev staging smoke and integration qualification (REPOMAP-CI0A, retiered
# by REPOMAP-CI-PIPE0; formerly repomap-dev-gate).
#
# Trust boundary: GitHub-hosted Linux, private repository only, repository-local
# workflow, repository-owned staging command. No self-hosted runner, no Tart,
# no JACA runtime, no inbound connectivity, no model invocation, no secrets, and
# a read-only token.
#
# This workflow no longer runs on ordinary pull-request updates. It runs only on
# an explicit logical gate request: an operator (later, the JACA git broker)
# approves one exact base/head pair and dispatches it. workflow_dispatch is only
# the bootstrap transport; the same repomap-ci-gate-request-v1 semantics are
# constructible by JACA against an ephemeral Tart-hosted runner.
#
# This workflow is an evidence executor, not a git broker. It holds no write
# permission, moves no ref, merges nothing, and closes nothing. It emits
# repomap-ci-gate-result-v1; the operator or JACA decides what to merge.
#
# Qualifying a pull request necessarily executes that pull request's own test
# code. The integrity artifact is therefore the SHA-bound gate result, not
# isolation of the runner from the candidate.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number carrying the approved revision"
        required: true
        type: number
      approved_base_sha:
        description: "Exact approved staging base commit SHA"
        required: true
        type: string
      approved_head_sha:
        description: "Exact approved pull request head commit SHA"
        required: true
        type: string
      approval_id:
        description: "Opaque approval correlation value"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  # An authorization run must never be cancelled by a later dispatch: a
  # half-finished gate must not be mistaken for a withdrawn authorization.
  group: repomap-staging-gate-${{ inputs.pr_number }}-${{ inputs.approval_id }}
  cancel-in-progress: false

jobs:
  repomap-staging-gate:
    name: repomap-staging-gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # The dispatch ref/SHA instantiated this workflow. Capture its trusted,
      # stdlib-only gate contract before any candidate-controlled checkout.
      - name: Check out the trusted staging executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Preserve the trusted gate contract
        run: |
          mkdir -p "${RUNNER_TEMP}/ci"
          cp tools/ci/gate_contract.py "${RUNNER_TEMP}/gate_contract.py"
          cp tools/ci/gate_contract_bindings.py "${RUNNER_TEMP}/ci/gate_contract_bindings.py"
          cp tools/ci/gate_contract_results.py "${RUNNER_TEMP}/ci/gate_contract_results.py"
          cp tools/ci/gate_contract_runtime.py "${RUNNER_TEMP}/ci/gate_contract_runtime.py"

      - name: Resolve current pull request state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '{number, state, draft, base: {ref: .base.ref}, head: {ref: .head.ref, repo: {full_name: .head.repo.full_name}}}' \
            > "${RUNNER_TEMP}/pull-request.json"

      # Cheap, stdlib-only, and deliberately ahead of every expensive step. A
      # dispatch from the wrong ref, a stale approved base, a non-staging PR, a
      # forked head, or a closed/draft pull request all fail here.
      - name: Bind the approved gate request
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          APPROVED_BASE_SHA: ${{ inputs.approved_base_sha }}
          APPROVED_HEAD_SHA: ${{ inputs.approved_head_sha }}
          APPROVAL_ID: ${{ inputs.approval_id }}
        run: |
          python3 -S -E "${RUNNER_TEMP}/gate_contract.py" resolve \
            --gate-kind staging \
            --pr-number "${PR_NUMBER}" \
            --approved-base-sha "${APPROVED_BASE_SHA}" \
            --approved-head-sha "${APPROVED_HEAD_SHA}" \
            --executor-ref "${GITHUB_REF}" \
            --executor-sha "${GITHUB_SHA}" \
            --approval-id "${APPROVAL_ID}" \
            --repository "${GITHUB_REPOSITORY}" \
            --pull-request-json "${RUNNER_TEMP}/pull-request.json" \
            --request-out "${RUNNER_TEMP}/gate-request.json"

      # The merge candidate, not the bare feature head. refs/pull/N/merge is the
      # pull request merged into its current base, so the suite qualifies what
      # would actually land. fetch-depth 2 makes both parents resolvable for the
      # proof below. A vanished candidate fails closed at checkout.
      - name: Check out the pull request merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ inputs.pr_number }}/merge
          fetch-depth: 2
          persist-credentials: false

      # The merge commit's own parents prove the base/head relation instead of
      # trusting API fields. Drift between approval and dispatch surfaces here as
      # a red gate, which is the correct outcome.
      - name: Verify the tested merge candidate
        run: |
          {
            echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
            echo "CANDIDATE_TREE=$(git rev-parse 'HEAD^{tree}')"
            echo "CANDIDATE_BASE_PARENT=$(git rev-parse 'HEAD^1')"
            echo "CANDIDATE_HEAD_PARENT=$(git rev-parse 'HEAD^2')"
          } >> "${GITHUB_ENV}"
          python3 -S -E "${RUNNER_TEMP}/gate_contract.py" verify \
            --request-json "${RUNNER_TEMP}/gate-request.json" \
            --candidate-sha "$(git rev-parse HEAD)" \
            --candidate-tree "$(git rev-parse 'HEAD^{tree}')" \
            --candidate-base-parent "$(git rev-parse 'HEAD^1')" \
            --candidate-head-parent "$(git rev-parse 'HEAD^2')"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Exact free-space telemetry, recorded non-destructively. The
      # staging profile keeps its architectural 10 GiB reserve: nothing is
      # deleted and no override weakens admission. The sandbox provides the
      # candidate test/toolchain environment and pulls integration prerequisites
      # into its owned inner daemon before the inner canonical Docker baseline.
      #
      # The single project-owned staging command runs substantial smoke first
      # and integration second. Unit evidence is not recomputed here. Test
      # ordering, per-suite coverage arithmetic, and
      # operation accounting stay owned by run_tests.py, not by this file.
      # TEST-ISO2 makes sandbox admission automatic; --sandbox below is a
      # redundant compatibility assertion, not the source of isolation.
      #
      # ADR 0053 admission arguments for an ephemeral single-tenant Linux host:
      #   - the exhaustive resource profile sizes this staging gate as a 4 GiB
      #     run-owned runaway ceiling and the independent 10 GiB
      #     host free-space floor. heavy remains the profile for genuinely
      #     heavy campaigns and is not weakened by this gate;
      #   - exclusive attestation is honest: the runner is destroyed after this
      #     job and runs no other RepoMap work;
      #   - pressure degradation is attested because /proc/meminfo reports free
      #     memory but no pressure level, so admission records DEGRADED.
      - name: Record free disk before the staging suite
        run: df -B1 /

      - name: Run the staging smoke and integration gate
        id: staging
        run: |
          python3 tools/run_tests.py \
            --suite staging \
            --hygiene-profile exhaustive \
            --declared-complete-gates 1 \
            --operator-attest-exclusive \
            --operator-attest-pressure-degradation \
            --pg-container-port 55433 \
            --sandbox \
            --report \
            --report-dir "${GITHUB_WORKSPACE}/ci-test-report"

      # merge_authorized is true only when this exact recorded candidate passed.
      # If resolve failed, CANDIDATE_SHA is unset and no result is produced; if
      # verify failed, record re-validates the candidate and fails closed so a
      # refused gate can never be mistaken for an authorization.
      - name: Record the gate result
        if: ${{ always() && env.CANDIDATE_SHA != '' }}
        env:
          GATE_CONCLUSION: ${{ steps.staging.outcome == 'success' && 'success' || 'failure' }}
        run: |
          python3 -S -E "${RUNNER_TEMP}/gate_contract.py" record \
            --request-json "${RUNNER_TEMP}/gate-request.json" \
            --candidate-sha "${CANDIDATE_SHA}" \
            --candidate-tree "${CANDIDATE_TREE}" \
            --candidate-base-parent "${CANDIDATE_BASE_PARENT}" \
            --candidate-head-parent "${CANDIDATE_HEAD_PARENT}" \
            --conclusion "${GATE_CONCLUSION}" \
            --result-out "${RUNNER_TEMP}/repomap-ci-gate-result-v1.json"

      - name: Upload the gate result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repomap-ci-gate-result-v1
          path: ${{ runner.temp }}/repomap-ci-gate-result-v1.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repomap-staging-gate-report
          path: ci-test-report
          if-no-files-found: warn
          retention-days: 14
