name: repomap-unit-tests

# Private repo-map_dev PR unit-test lane (REPOMAP-CI2A).
#
# Trust boundary: GitHub-hosted Linux, private repository only, repository-local
# workflow, read-only permissions, unpersisted credentials, and no secrets or
# live integration resources. The canonical unit runner owns population and
# purity policy; this workflow does not reproduce pytest selection.
#
# The unit runner validates and builds the existing Go helper before pytest, so
# this lane pins the Go toolchain from src/main/go/go.mod and installs the exact
# golangci-lint release owned by tools/ci/pre_review_tools.json. This is
# bootstrap for the canonical unit population, not a separate Go test lane.

on:
  pull_request:
    branches: [staging]
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - "src/main/python/**"
      - "src/main/go/**"
      - "src/test/**"
      - "tools/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repomap-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repomap-unit-tests:
    name: repomap-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Stdlib-only topology validation fails before Python dependency install.
      - name: Check CI topology contracts
        run: python3 tools/ci/ci_topology.py

      - name: Set up Go for the canonical runner
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/main/go/go.mod
          cache: false

      - name: Install the pinned Go linter
        run: |
          python3 tools/ci/bootstrap_tool.py \
            --tool golangci-lint \
            --bin-dir "${RUNNER_TEMP}/repomap-tools/bin"
          "${RUNNER_TEMP}/repomap-tools/bin/golangci-lint" version

      # Unit collection imports docker and psutil for monkeypatched readers and
      # failure mapping. Installing these packages grants no live-resource
      # authority; TEST-ISO1 purity guards remain load-bearing.
      - name: Install unit-test dependencies
        run: python -m pip install --editable ".[test,scale-tools,static-analysis]"

      # ADR 0048/0053 ephemeral host admission: single-tenant GitHub runner
      # satisfies the 10 GiB architectural floor, but ordinary default is 20 GiB.
      - name: Record free disk before the canonical unit suite
        run: df -B1 /

      - name: Run the canonical unit population with 85/85 coverage
        env:
          REPOMAP_TEST_HYGIENE_MIN_FREE_DISK_BYTES: "10737418240"
        run: python3 tools/run_tests.py --suite unit
